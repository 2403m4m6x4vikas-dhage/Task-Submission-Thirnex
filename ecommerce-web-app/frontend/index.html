<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vikas Store</title><link rel="stylesheet" href="style.css"></head><body><header><b>VIKAS STORE</b><nav><a href="#shop">Shop</a><a href="#login">Login</a><button onclick="showCart()">Cart (<span id="count">0</span>)</button></nav></header><main><section class="hero"><div><small>FULL-STACK E-COMMERCE</small><h1>Everything you need.<br><span>In one place.</span></h1><p>Browse products, add them to your cart and place an order.</p><a href="#shop" class="btn">Start Shopping</a></div></section><section id="shop"><h2>Featured Products</h2><div id="products" class="products"></div></section><section id="login" class="login"><h2>Account</h2><div class="form"><input id="name" placeholder="Name (for registration)"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div><button class="btn" onclick="register()">Register</button><button class="btn alt" onclick="login()">Login</button></div><p id="msg"></p></div></section></main><aside id="cart"><button onclick="hideCart()">✕</button><h2>Your Cart</h2><div id="cartItems"></div><h3>Total: ₹<span id="total">0</span></h3><button class="btn" onclick="checkout()">Checkout</button></aside><script src="script.js"></script></body></html>
