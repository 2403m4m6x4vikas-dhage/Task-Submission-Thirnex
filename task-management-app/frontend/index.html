<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow — Task Manager</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><header><div class="brand">Task<span>Flow</span></div><button id="logout" class="hidden">Logout</button></header><section id="auth" class="auth"><div class="card"><h1 id="authTitle">Welcome back</h1><p id="authSub">Sign in to manage your tasks.</p><form id="authForm"><input id="name" placeholder="Full name" class="hidden"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>Login</button></form><p class="switch" id="switch">New user? <b>Register</b></p><p id="authMsg"></p></div></section><section id="dashboard" class="hidden dashboard"><div class="top"><div><p class="muted">YOUR WORKSPACE</p><h1>My Tasks</h1></div><button id="newTask">+ New Task</button></div><div class="stats"><div><b id="total">0</b><small>Total</small></div><div><b id="pending">0</b><small>Pending</small></div><div><b id="done">0</b><small>Completed</small></div></div><form id="taskForm" class="card hidden"><input id="taskId" type="hidden"><input id="title" placeholder="Task title" required><textarea id="description" placeholder="Description"></textarea><div class="row"><select id="priority"><option>Low</option><option selected>Medium</option><option>High</option></select><input id="due" type="date"></div><button>Save Task</button><button type="button" id="cancel" class="secondary">Cancel</button></form><div id="tasks" class="tasks"></div></section></div><script src="script.js"></script></body></html>
